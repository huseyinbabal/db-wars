# Short run for pull requests (.github/bench/run.sh): the shop mix with one write in twenty, on a small data set, about a minute per database.
DBS="postgres mysql"
SEED="-products 100000 -orders 100000"
K6_SCRIPT=k6/shop.js
K6_ENV="-e MIX=shop5 -e ORDERS=100000 -e START=500 -e STEP=500 -e STEPS=6 -e HOLD=5s"
DSN_postgres="postgres://shop:bench@127.0.0.1:5432/shop?sslmode=disable"
DSN_mysql="shop:bench@tcp(127.0.0.1:3306)/shop?parseTime=true&cte_max_recursion_depth=1000000"
export DB_MAX_OPEN=100
