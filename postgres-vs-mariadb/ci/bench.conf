# Short run for pull requests (.github/bench/run.sh): read-heavy users on a small data set, about a minute per database.
DBS="postgres mariadb"
SEED="-products 10000 -orders 100000"
K6_SCRIPT=k6/users.js
K6_ENV="-e WRITES=0.05 -e PRODUCTS=10000 -e ORDERS=100000 -e USERS=100,200,400 -e HOLD=10"
DSN_postgres="postgres://shop:bench@127.0.0.1:5432/shop?sslmode=disable"
DSN_mariadb="shop:bench@tcp(127.0.0.1:3306)/shop?parseTime=true"
export DB_MAX_OPEN=100
