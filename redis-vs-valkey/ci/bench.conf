# Short run for pull requests (.github/bench/run.sh): the same product/trending/cart mix on 100,000 products, about a minute per server.
DBS="redis valkey"
SEED="-products 100000"
K6_SCRIPT=k6/shop.js
K6_ENV="-e PRODUCTS=100000 -e START=1000 -e STEP=1000 -e STEPS=6 -e HOLD=5s -e MAXVUS=2000"
DSN_redis="127.0.0.1:6379"
DSN_valkey="127.0.0.1:6379"
export KV_ADDR=127.0.0.1:6379 KV_POOL=200   # the app reads KV_ADDR; only one server runs at a time
