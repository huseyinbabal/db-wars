# Same images and settings as the DigitalOcean runs (setup/db.sh + run1.sh): defaults, io-threads 1.
# Tune here (for example --io-threads 3) to see the effect in a pull request.
services:
  redis:
    image: redis:8.10.3-trixie
    network_mode: host
    command: [redis-server, --bind, 127.0.0.1, --port, "6379", --protected-mode, "no", --io-threads, "1"]
    healthcheck: { test: [CMD, redis-cli, -h, 127.0.0.1, PING], interval: 1s, retries: 60 }
  valkey:
    image: valkey/valkey:9.1.3-trixie
    network_mode: host
    command: [valkey-server, --bind, 127.0.0.1, --port, "6379", --protected-mode, "no", --io-threads, "1"]
    healthcheck: { test: [CMD, valkey-cli, -h, 127.0.0.1, PING], interval: 1s, retries: 60 }
