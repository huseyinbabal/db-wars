# Short run for pull requests (.github/bench/run.sh): the shop mix on a small data set, about a minute per database.
DBS="postgres mongo"
SEED="-orders 100000 -items 3"
K6_SCRIPT=k6/doc.js
K6_ENV="-e MIX=shop -e ORDERS=100000 -e START=200 -e STEP=200 -e STEPS=6 -e HOLD=5s"
DSN_postgres="postgres://shop:bench@127.0.0.1:5432/shop?sslmode=disable"
DSN_mongo="mongodb://127.0.0.1:27017/shop?w=1&journal=true"
export DB_MAX_OPEN=100
