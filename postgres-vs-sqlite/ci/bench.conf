# Short run for pull requests (.github/bench/run.sh): the shop mix with one write in five, on a small data set, about a minute per database.
DBS="postgres sqlite"
SEED="-products 10000 -orders 100000"
K6_SCRIPT=k6/shop.js
K6_ENV="-e WRITES=0.2 -e PRODUCTS=10000 -e ORDERS=100000 -e START=250 -e STEP=250 -e STEPS=6 -e HOLD=5s"
DSN_postgres="postgres://shop:bench@127.0.0.1:5432/shop?sslmode=disable"
DSN_sqlite="file:/tmp/shop-bench/shop.db?_journal_mode=WAL&_synchronous=FULL&_busy_timeout=5000&_cache_size=-10240"
rm -rf /tmp/shop-bench; mkdir -p /tmp/shop-bench   # every run starts from a new file, as a new container does for Postgres
export DB_MAX_OPEN=100
