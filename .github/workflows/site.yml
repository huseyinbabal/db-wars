# Every merge to main: keep the merged PR's bench numbers on the site-data branch, then publish db-wars.huseyinbabal.dev.
name: Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency: site
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { ref: site-data, path: data }
      - name: Record the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/merged
          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          [ -n "$PR" ] || { echo "no merged PR for this commit"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > pr.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | {filename, patch}' > files.jsonl
          python3 .github/bench/guard.py < files.jsonl > /dev/null || { echo "PR $PR changed the test"; exit 0; }
          RUN=$(gh run list --workflow Bench --commit "$(python3 -c "import json; print(json.load(open('pr.json'))['head']['sha'])")" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$RUN" ] || { echo "no bench run for PR $PR"; exit 0; }
          mkdir artifacts; gh run download "$RUN" --pattern 'bench-*' --dir artifacts || exit 0
          mkdir flat; find artifacts -name '*.json' -exec cp {} flat/ \;
          python3 .github/bench/record.py flat pr.json data/merged
          cd data; git add -A
          git diff --cached --quiet || { git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "PR $PR" && git push -q; }
      - run: python3 site/build.py data
      - name: Publish
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
