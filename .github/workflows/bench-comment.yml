# Posts the Bench results on the pull request. Runs from main with a write token, so the artifact is treated as untrusted:
# render.py keeps only validated names and numbers, and the PR number must match the commit that was tested.
name: Bench comment
on:
  workflow_run:
    workflows: [Bench]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [ -n "$(ls results/*.json 2>/dev/null)" ] || { echo "no results"; exit 0; }
          PR=$(python3 .github/bench/render.py results --pr)
          [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" = "$HEAD_SHA" ] || { echo "PR $PR is not at $HEAD_SHA"; exit 0; }
          python3 .github/bench/render.py results > body.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- bench -->")) | .id' | head -n1)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@body.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md >/dev/null; fi
